[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-imoveis"
version = "0.1.0"
description = "Monitor automático de oportunidades imobiliárias em fontes públicas portuguesas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Thiago Souza" }]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.8",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0.30",
    "streamlit>=1.37",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "tenacity>=8.3",
    "typer>=0.12",
    "playwright>=1.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: testes de integração que acedem a fontes reais",
    "live: testes que fazem pedidos em tempo real aos sites",
    "slow: testes lentos",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["monitor", "tests", "main.py", "app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests/fixtures/"]

[tool.coverage.run]
source = ["monitor"]
omit = ["*/dashboard/pages/*"]
